name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: forge-1.20.1
            directory: .
            java: '17'
          - target: neoforge-1.21.1
            directory: ports/mc-1.21.1
            java: '21'
          - target: neoforge-1.21.2
            directory: ports/mc-1.21.2
            java: '21'
          - target: neoforge-26.1.1
            directory: ports/mc-26.1.1
            java: '25'
          - target: neoforge-26.1.2
            directory: ports/mc-26.1.2
            java: '25'
          - target: neoforge-26.2
            directory: ports/mc-26.2
            java: '25'
          - target: neoforge-26.3
            directory: ports/mc-26.3
            java: '25'
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
          cache-dependency-path: |
            ${{ matrix.directory }}/*.gradle
            ${{ matrix.directory }}/gradle.properties
            ${{ matrix.directory }}/gradle/wrapper/gradle-wrapper.properties
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SurvivingTheAftermath-${{ matrix.target }}
          path: ${{ matrix.directory }}/build/libs/*.jar
          if-no-files-found: error
