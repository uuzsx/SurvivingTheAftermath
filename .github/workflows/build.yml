name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: Build neoforge-1.21.2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            *.gradle
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
      - name: Verify gameplay and audio, then build
        run: |
          chmod +x gradlew
          ./gradlew runGameTestServer clientAudioCheck build --no-daemon --console=plain
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SurvivingTheAftermath-neoforge-1.21.2
          path: build/libs/*.jar
          if-no-files-found: error
