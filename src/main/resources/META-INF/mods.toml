modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/uuzsx/SurvivingTheAftermath/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Surviving the Aftermath"
displayURL="https://github.com/uuzsx/SurvivingTheAftermath"
logoFile="surviving_the_aftermath.png"
authors="${mod_authors}"
description='''
This Mod supplements the vanilla raid content and adds related API to expand more adventure content.
Explore ruined structures and cities, face the Nether Raid, and discover powerful enchantments.

劫后余生：扩展原版突袭玩法，加入下界副本、遗迹、城市与附魔。
使用钻石打火石开启 11 波挑战；每波开始时建筑逐渐下界化，胜利后获得奖励并播放音乐。
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
